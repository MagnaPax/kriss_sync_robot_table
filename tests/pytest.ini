# pytest.ini
[pytest]
# 테스트 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*


# 사용자 정의 마커 등록
markers =
    slow: 시간이 오래 걸리는 통합 테스트


# pytest 실행 시 기본 출력 옵션
addopts = 
    -v
    -s
    --tb=short
    --strict-markers
    -p no:warnings


# 테스트 디렉토리 설정
testpaths = tests


# 특정 경고 무시 설정
filterwarnings =
    ignore::DeprecationWarning
    ignore::PytestUnknownMarkWarning